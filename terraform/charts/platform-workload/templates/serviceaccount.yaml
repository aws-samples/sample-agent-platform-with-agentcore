apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workload.name" . }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
# The Kubernetes API token is never needed by a platform service. IRSA uses its
# own projected token volume, injected by the EKS webhook independently of this.
automountServiceAccountToken: false
