# Demo workload for the IAM service entry: a pod that calls an agent channel
# with EKS Pod Identity (SigV4) + an optional robot SSO identity.
#
# Prereqs (the channel's SOP walks through 1–3; deploy-eks-demo.sh automates
# all of it for the demo cluster):
#   1. IAM role trusted by pods.eks.amazonaws.com with the channel policy
#   2. eks-pod-identity-agent add-on on the cluster
#   3. aws eks create-pod-identity-association --namespace agent-demo \
#        --service-account order-service --role-arn <role>
#   4. kubectl create secret generic robot-idp -n agent-demo \
#        --from-literal=client_id=... --from-literal=client_secret=...
#   5. Fill in the ConfigMap values below (SERVICE_API_URL, CHANNEL_ID, IDP_TOKEN_URL)
apiVersion: v1
kind: Namespace
metadata:
  name: agent-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: agent-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: agent-demo
data:
  SERVICE_API_URL: "REPLACED_BY_DEPLOY_SCRIPT"
  CHANNEL_ID: "REPLACED_BY_DEPLOY_SCRIPT"
  IDP_TOKEN_URL: "REPLACED_BY_DEPLOY_SCRIPT"
  CONVERSATION_ID: "eks-demo-pod"
  INTERVAL_S: "300"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-code
  namespace: agent-demo
data:
  caller.py: "REPLACED_BY_DEPLOY_SCRIPT"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: agent-demo
  labels: { app: order-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      serviceAccountName: order-service
      containers:
        - name: caller
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install --quiet --no-cache-dir boto3 requests && python /app/caller.py
          envFrom:
            - configMapRef: { name: order-service-config }
          env:
            - name: ROBOT_CLIENT_ID
              valueFrom: { secretKeyRef: { name: robot-idp, key: client_id, optional: true } }
            - name: ROBOT_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: robot-idp, key: client_secret, optional: true } }
          volumeMounts:
            - { name: code, mountPath: /app }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: code
          configMap: { name: order-service-code }
