# Module interface tables (inputs and outputs) injected into each module's
# README.md between the BEGIN_TF_DOCS / END_TF_DOCS markers.
#   for m in terraform/workloads/modules/*/; do terraform-docs -c .terraform-docs.yml "$m"; done
# Text outside the markers is hand-written and kept. CI checks the tables are
# current (ci/tf-lint.sh, catalog tf.lint).
formatter: markdown table
sections:
  show:
    - inputs
    - outputs
output:
  file: README.md
  mode: inject
sort:
  enabled: true
  by: required
settings:
  anchor: false
  default: true
  escape: true
  hide-empty: true
  indent: 2
  required: true
  type: true
